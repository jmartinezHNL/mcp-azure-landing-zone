# Configuración del servidor MCP "Azure Landing Zone Assistant".
#
# azure.default_subscription_id: subscripción usada cuando la herramienta se
#   invoca sin especificar un subscription_id explícito.
# terraform.working_dir: directorio raíz del código Terraform de la Landing Zone
#   sobre el que se ejecutará "terraform plan" para detectar drift.

azure:
  default_subscription_id: "00000000-0000-0000-0000-000000000000"

terraform:
  working_dir: "/Users/juancarlosmartinez/PycharmProjects/mcp-azure-landing-zone/terraform"
  # Segundos máximos de espera para "terraform plan" antes de abortar.
  timeout_seconds: 600
